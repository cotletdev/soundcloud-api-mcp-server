[project]
name = "soundcloud-api-mcp"
version = "1.0.2"
description = "Self-hosted SoundCloud API and MCP server on your own Chrome session. Use SoundCloud from Claude, Cursor, Codex or any MCP client or AI agent."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Communications"]
requires-python = ">=3.11"
authors = [{ name = "Cotlet", email = "contact@cotlet.dev" }]
keywords = ["soundcloud", "soundcloud api", "soundcloud mcp", "mcp server", "claude", "chatgpt", "cursor"]
dependencies = [
    "curl_cffi>=0.13,<0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
    "websockets>=13",
]

[project.urls]
Homepage = "https://cotlet.dev/integrations/soundcloud-api-mcp-server"
Source = "https://github.com/cotletdev/soundcloud-api-mcp-server"

[project.scripts]
soundcloud-mcp = "soundcloud_api_mcp.cli:main"
soundcloud-api-mcp = "soundcloud_api_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundcloud_api_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
